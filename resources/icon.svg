<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1f6e"/>
      <stop offset="50%" stop-color="#7c2a87"/>
      <stop offset="100%" stop-color="#c43a8a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#2a2545"/>
      <stop offset="100%" stop-color="#3d3666"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- пиксельная сетка фона -->
  <g fill="#000" opacity="0.08">
    <rect x="0" y="0" width="128" height="1"/>
    <rect x="0" y="16" width="128" height="1"/>
    <rect x="0" y="32" width="128" height="1"/>
    <rect x="0" y="48" width="128" height="1"/>
    <rect x="0" y="64" width="128" height="1"/>
    <rect x="0" y="80" width="128" height="1"/>
    <rect x="0" y="96" width="128" height="1"/>
    <rect x="0" y="112" width="128" height="1"/>
    <rect x="0" y="127" width="128" height="1"/>
    <rect x="0" y="0" width="1" height="128"/>
    <rect x="16" y="0" width="1" height="128"/>
    <rect x="32" y="0" width="1" height="128"/>
    <rect x="48" y="0" width="1" height="128"/>
    <rect x="64" y="0" width="1" height="128"/>
    <rect x="80" y="0" width="1" height="128"/>
    <rect x="96" y="0" width="1" height="128"/>
    <rect x="112" y="0" width="1" height="128"/>
    <rect x="127" y="0" width="1" height="128"/>
  </g>

  <!-- акула: 32x20 pixels, scale 4 → 128x80, центрируем
       offset x=0, y=24 -->
  <g transform="translate(0 28) scale(4)">
    <!-- тень акулы -->
    <g fill="#000" opacity="0.25" transform="translate(0 1)">
      <rect x="14" y="3" width="3" height="1"/>
      <rect x="12" y="4" width="6" height="1"/>
      <rect x="11" y="5" width="9" height="1"/>
      <rect x="9" y="6" width="13" height="1"/>
      <rect x="6" y="7" width="17" height="1"/>
      <rect x="4" y="8" width="20" height="1"/>
      <rect x="3" y="9" width="22" height="1"/>
      <rect x="3" y="10" width="22" height="1"/>
      <rect x="4" y="11" width="20" height="1"/>
      <rect x="5" y="12" width="18" height="1"/>
      <rect x="8" y="13" width="14" height="1"/>
      <rect x="12" y="14" width="7" height="1"/>
    </g>

    <!-- спинной плавник -->
    <g fill="url(#body)">
      <rect x="14" y="2" width="3" height="1"/>
      <rect x="12" y="3" width="6" height="1"/>
      <rect x="11" y="4" width="9" height="1"/>
    </g>

    <!-- голова и тело верх -->
    <g fill="#1a1a2e">
      <rect x="9" y="5" width="13" height="1"/>
      <rect x="6" y="6" width="17" height="1"/>
      <rect x="4" y="7" width="20" height="1"/>
      <rect x="3" y="8" width="22" height="1"/>
      <rect x="3" y="9" width="22" height="1"/>
    </g>

    <!-- блик на спине -->
    <g fill="#5e4cb5" opacity="0.7">
      <rect x="9" y="6" width="13" height="1"/>
      <rect x="11" y="7" width="11" height="1"/>
    </g>

    <!-- тело низ (светлее = пузо) -->
    <g fill="#2d2447">
      <rect x="4" y="10" width="20" height="1"/>
      <rect x="5" y="11" width="18" height="1"/>
      <rect x="8" y="12" width="14" height="1"/>
      <rect x="12" y="13" width="7" height="1"/>
    </g>

    <!-- хвост -->
    <g fill="#1a1a2e">
      <rect x="24" y="6" width="2" height="2"/>
      <rect x="25" y="7" width="2" height="2"/>
      <rect x="26" y="8" width="1" height="3"/>
      <rect x="25" y="11" width="2" height="2"/>
      <rect x="24" y="12" width="2" height="2"/>
    </g>

    <!-- грудной плавник -->
    <g fill="#1a1a2e">
      <rect x="9" y="12" width="4" height="1"/>
      <rect x="10" y="13" width="3" height="1"/>
      <rect x="11" y="14" width="2" height="1"/>
    </g>

    <!-- пасть -->
    <g fill="#1a1a2e">
      <rect x="2" y="9" width="2" height="1"/>
      <rect x="1" y="10" width="2" height="1"/>
    </g>

    <!-- зубы -->
    <g fill="#f5efe6">
      <rect x="3" y="10" width="1" height="1"/>
      <rect x="5" y="10" width="1" height="1"/>
      <rect x="7" y="10" width="1" height="1"/>
    </g>

    <!-- глаз -->
    <rect x="6" y="8" width="2" height="2" fill="#f5efe6"/>
    <rect x="7" y="8" width="1" height="1" fill="#1a1a2e"/>

    <!-- жабры -->
    <g fill="#7d6cd2" opacity="0.6">
      <rect x="14" y="9" width="1" height="2"/>
      <rect x="16" y="9" width="1" height="2"/>
      <rect x="18" y="9" width="1" height="2"/>
    </g>
  </g>

  <!-- пузырьки сверху -->
  <g fill="#a7e7f0" opacity="0.8">
    <rect x="20" y="14" width="2" height="2"/>
    <rect x="26" y="22" width="2" height="2"/>
    <rect x="105" y="12" width="3" height="3"/>
    <rect x="100" y="20" width="2" height="2"/>
    <rect x="22" y="105" width="2" height="2"/>
    <rect x="108" y="100" width="2" height="2"/>
  </g>

  <!-- надпись COCKPIT внизу мелкая (опционально) -->
  <g fill="#f5efe6" opacity="0.55" font-family="Menlo,monospace" font-size="11" font-weight="bold">
    <text x="64" y="120" text-anchor="middle">COCKPIT</text>
  </g>
</svg>

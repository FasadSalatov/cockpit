<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 16" shape-rendering="crispEdges">
  <g fill="currentColor">
    <!-- спинной плавник -->
    <rect x="10" y="1" width="2" height="1"/>
    <rect x="9" y="2" width="4" height="1"/>
    <!-- тело -->
    <rect x="8" y="3" width="6" height="1"/>
    <rect x="6" y="4" width="11" height="1"/>
    <rect x="5" y="5" width="13" height="1"/>
    <rect x="2" y="6" width="17" height="1"/>
    <rect x="1" y="7" width="18" height="1"/>
    <rect x="1" y="8" width="18" height="1"/>
    <rect x="2" y="9" width="17" height="1"/>
    <rect x="3" y="10" width="15" height="1"/>
    <rect x="5" y="11" width="12" height="1"/>
    <rect x="8" y="12" width="7" height="1"/>
    <!-- грудной плавник -->
    <rect x="7" y="11" width="3" height="1"/>
    <rect x="8" y="12" width="2" height="1"/>
    <!-- хвост -->
    <rect x="19" y="4" width="2" height="2"/>
    <rect x="20" y="5" width="2" height="2"/>
    <rect x="21" y="6" width="1" height="3"/>
    <rect x="20" y="9" width="2" height="2"/>
    <rect x="19" y="10" width="2" height="2"/>
    <!-- пасть -->
    <rect x="1" y="9" width="3" height="1"/>
  </g>
  <!-- глаз (вырез) -->
  <rect x="4" y="7" width="2" height="2" fill="transparent"/>
  <rect x="5" y="7" width="1" height="1" fill="currentColor"/>
</svg>
